name: Build and upload client artifact

on:
  workflow_call:
    inputs:
      environment:
        type: string
        required: true
      tag:
        type: string
        required: true
    secrets:
      VITE_SENTRY_DSN:
        required: false
      SENTRY_CLIENT_AUTH_TOKEN:
        required: false

jobs:
  build-client:
    environment: ${{ inputs.environment }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          fetch-tags: true
          fetch-depth: 200

      - uses: pnpm/action-setup@v4.2.0
        with:
          version: 10
          run_install: false

      - name: Use Node.js
        uses: actions/setup-node@v6.1.0
        with:
          node-version: '24.12.0'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build DSFR
        run: pnpm --filter client run update-icons

      - name: Cached fonts
        id: cached_fonts
        uses: actions/cache@v5
        with:
          path: apps/client/src/assets/fonts
          key: assets-montserrat-7.222_noto-2.015

      - name: Download Fonts
        if: steps.cached_fonts.outputs.cache-hit != 'true'
        shell: bash
        run: apps/client/scripts/install-fonts.sh

      - name: Build client
        run: pnpm --filter client... build
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_GDS_TRANSPA_FILES_IDS: ${{ vars.VITE_GDS_TRANSPA_FILES_IDS }}
          VITE_DEPLOY_ENV: ${{ vars.VITE_DEPLOY_ENV }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          VITE_TAGGED_VERSION: ${{ inputs.tag }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_CLIENT_AUTH_TOKEN }}

      - name: Create Archive
        run: |
          # In Scalingo dashboard, we set the PROJECT_DIR environment variable to client
          mkdir -p scalingo/client
          cp -r apps/client/dist "$_"
          cp -r apps/client/scalingo/* "$_"
          cp apps/client/scalingo/.buildpacks "$_"
          tar -czf client-scalingo.tar.gz scalingo

      - name: Upload as Artifact
        uses: actions/upload-artifact@v4
        with:
          retention-days: 1
          name: client-scalingo-${{ inputs.tag }}
          path: client-scalingo.tar.gz
