name: Build and upload API artifact

on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true

jobs:
  build-and-upload-api-artifact:
    runs-on: ubuntu-latest
    env:
      TZ: Etc/UTC
      DATABASE_URL: postgresql://fondation:secret@localhost:5435/fondation
    services:
      postgres:
        image: postgres:13.2
        env:
          POSTGRES_USER: fondation
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: fondation
        ports:
          - 5435:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.9.0"
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm --filter api... install --frozen-lockfile --ignore-scripts
      - name: Migrate Prisma for generation
        run: pnpm --filter api prisma migrate --config prisma.config.ts deploy
      - name: Build prisma
        run: pnpm --filter api prisma generate --sql --config prisma.config.ts
      - name: Build api
        run: pnpm --filter api... build
      - name: Create Archive
        run: ./apps/api/scripts/build-for-scalingo.sh
      - name: Archive dist
        uses: actions/upload-artifact@v4
        with:
          name: api-scalingo-${{ inputs.tag }}
          path: api-scalingo.tar.gz
