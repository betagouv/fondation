name: Integration checks
permissions:
  contents: read

on:
  pull_request:
    types: [opened, synchronize]
    branches-ignore:
      - 'dependabot/*'

# a new push to a pull request cancels the checks of the previous one
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TZ: Etc/UTC
  DATABASE_URL: postgresql://fondation:secret@localhost:5435/fondation
  COOKIE_SECRET: 'secret-48b86b07-8668-4e1d-86b8-ee62e97fec7e'
  ORIGIN_URL: http://localhost:3000
  FRONTEND_ORIGIN_URL: http://localhost:5173
  S3_ACCESS_KEY: fondation
  S3_SECRET_KEY: fondation-secret
  S3_BUCKET: sandbox-csm-fondation-reports-context
  S3_REGION: eu-west-2
  S3_FORCE_PATH_STYLE: 'true'
  S3_ENDPOINT: http://localhost:9000
  GOTENBERG_API_URL: http://gotenberg.example.com

jobs:
  checks:
    if: github.actor != 'dependabot[bot]'
    timeout-minutes: 15
    runs-on: ubuntu-latest
    services: &services
      postgres:
        image: postgres:17.11@sha256:ff87138949ad9a46f32ff23bd6852b52ce024a13dffe9b4087be98292cdd3b4f
        env:
          POSTGRES_USER: fondation
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: fondation
        ports:
          - 5435:5432
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s
          --health-retries 5
      # same image and settings as apps/api/test/docker-compose-test.yaml
      s3:
        image: versity/versitygw:v1.10.0@sha256:89cad13cc981986ee284cbafea4613f9533ce6fd5f37a2c96c4c4fb8adb3a316
        env:
          ROOT_ACCESS_KEY: ${{ env.S3_ACCESS_KEY }}
          ROOT_SECRET_KEY: ${{ env.S3_SECRET_KEY }}
          VGW_BACKEND: posix
          VGW_BACKEND_ARG: /data
          VGW_PORT: ':9000'
          VGW_REGION: ${{ env.S3_REGION }}
          VGW_VERSIONING_DIR: /versions
        ports:
          - 9000:9000
        volumes:
          - s3-data:/data
          - s3-versions:/versions

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - uses: ./.github/setup

      - name: Create buckets if necessary
        run: node apps/api/scripts/init-buckets.js

      - name: Types check
        run: pnpm types:check

      - name: Types check tests and stories
        run: pnpm --filter client types:check:test

      - name: Lint
        run: pnpm lint:check

      - name: Check Tailwind colors
        run: pnpm --filter client lint:colors

      - name: Format
        run: pnpm format:check

      - name: Test Api UNIT
        run: pnpm --filter api test

      - name: Build
        run: pnpm build

  # the API end-to-end files run one after the other: two machines take half of them each
  api-e2e:
    if: github.actor != 'dependabot[bot]'
    timeout-minutes: 10
    runs-on: ubuntu-latest
    strategy:
      matrix:
        shard: [1, 2]
    services: *services

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - uses: ./.github/setup

      - name: Create buckets if necessary
        run: node apps/api/scripts/init-buckets.js

      - name: Test API E2E
        run: pnpm --filter api-e2e test --shard=${{ matrix.shard }}/2

  # the end-to-end tests of the client start the API, hence the database and the storage
  front:
    if: github.actor != 'dependabot[bot]'
    timeout-minutes: 10
    runs-on: ubuntu-latest
    services: *services

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - uses: ./.github/setup

      - name: Create buckets if necessary
        run: node apps/api/scripts/init-buckets.js

      - name: Test Front UNIT
        run: pnpm --filter client test

      - name: Test LOLFI generator
        run: pnpm --filter lolfi test

      - name: Install Playwright
        uses: ./.github/playwright

      - name: Test Client E2E
        run: pnpm --filter client test:e2e

  # the check the protection of develop requires: a skipped job would count as passed, so it runs whatever
  # the other jobs give and fails unless the three succeeded
  build:
    if: always() && github.actor != 'dependabot[bot]'
    needs: [checks, api-e2e, front]
    timeout-minutes: 1
    runs-on: ubuntu-latest
    steps:
      - name: Every job succeeded
        run: |
          test "${{ needs.checks.result }}" = success
          test "${{ needs.api-e2e.result }}" = success
          test "${{ needs.front.result }}" = success
