name: "Deploy staging"
permissions:
  contents: read
  packages: read

on:
  push:
    tags:
      - IT[0-9]+S[0-9]
      - IT[0-9]+S[0-9]+-[0-9]+

jobs:
  release:
    uses: ./.github/workflows/release.yml
    secrets: inherit
    with:
      environment: staging

  notify-changelog:
    needs: [release]
    runs-on: ubuntu-latest
    env:
      MATTERMOST_WEBHOOK: ${{ secrets.MATTERMOST_WEBHOOK }}
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          fetch-tags: true
          fetch-depth: 200

      - uses: pnpm/action-setup@v4.2.0
        with:
          version: 10
          run_install: false

      - name: Use Node.js
        uses: actions/setup-node@v6.1.0
        with:
          node-version: "24.12.0"
          cache: "pnpm"

      - shell: bash
        id: changelog
        run: |
          last_tags=$(git tag --merged HEAD --sort=-committerdate | /usr/bin/head -n2)
          echo "$last_tags"
          {
            echo 'markdown<<EOF'
            echo "**CHANGELOG**"
            node scripts/changelog $last_tags
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Outputs changelog
        env:
          CHANGELOG: ${{ steps.changelog.outputs.markdown }}
        run: echo "$CHANGELOG" >> $GITHUB_STEP_SUMMARY

      - name: Notify Mattermost
        if: ${{ env.MATTERMOST_WEBHOOK != '' }}
        env:
          CHANGELOG: ${{ steps.changelog.outputs.markdown }}
          MATTERMOST_WEBHOOK: ${{ env.MATTERMOST_WEBHOOK }}
        run: |
          jq -n --arg text "$CHANGELOG" '{text:$text}' \
            | curl -XPOST -i -H 'Content-type: application/json' -d @- "$MATTERMOST_WEBHOOK"
