name: 'Deploy staging'
permissions:
  contents: read
  packages: read

on:
  push:
    tags:
      - IT[0-9]+S[0-9]
      - IT[0-9]+S[0-9]+-[0-9]+

jobs:
  release:
    uses: ./.github/workflows/release.yml
    secrets:
      VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
      SCALINGO_API_TOKEN: ${{ secrets.SCALINGO_API_TOKEN }}
      SENTRY_API_AUTH_TOKEN: ${{ secrets.SENTRY_API_AUTH_TOKEN }}
      SENTRY_CLIENT_AUTH_TOKEN: ${{ secrets.SENTRY_CLIENT_AUTH_TOKEN }}
      SCALINGO_SSH_KEY: ${{ secrets.SCALINGO_SSH_KEY }}
    with:
      environment: staging

  notify:
    needs: [release]
    if: ${{ always() && needs.release.result != 'skipped' }}
    uses: ./.github/workflows/notify-tchap.yml
    secrets:
      TCHAP_ACCESS_TOKEN: ${{ secrets.TCHAP_ACCESS_TOKEN }}
    with:
      environment: staging
      result: ${{ needs.release.result }}
      tags_current: ${{ needs.release.outputs.tags_current }}
      tags_previous: ${{ needs.release.outputs.tags_previous }}
