name: Sync generated OpenAPI clients
permissions:
  contents: write
  packages: read
  pull-requests: write

on:
  push:
    branches:
      - develop

jobs:
  sync:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    env:
      TZ: Etc/UTC
      DATABASE_URL: postgresql://fondation:secret@localhost:5435/fondation
      COOKIE_SECRET: 'secret-48b86b07-8668-4e1d-86b8-ee62e97fec7e'
      ORIGIN_URL: http://localhost:3000
      FRONTEND_ORIGIN_URL: http://localhost:5173
      S3_ACCESS_KEY: fondation
      S3_SECRET_KEY: fondation-secret
      S3_BUCKET: sandbox-csm-fondation-reports-context
      S3_REGION: eu-west-2
      S3_FORCE_PATH_STYLE: 'true'
      S3_ENDPOINT: http://localhost:9000
      GOTENBERG_API_URL: http://gotenberg.example.com
    services:
      postgres:
        image: postgres:13.23@sha256:4689940c683801b4ab839ab3b0a0a3555a5fe425371422310944e89eca7d8068
        env:
          POSTGRES_USER: fondation
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: fondation
        ports:
          - 5435:5432
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s
          --health-retries 5

      minio:
        image: ghcr.io/betagouv/fondation-ci-minio:2025-11-11
        env:
          MINIO_ROOT_USER: ${{ env.S3_ACCESS_KEY }}
          MINIO_ROOT_PASSWORD: ${{ env.S3_SECRET_KEY }}
        ports:
          - 9000:9000

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093
        with:
          version: 11.11.0
          run_install: false

      - name: Use Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '24.12.0'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build internal dependencies
        run: pnpm --filter lolfi build

      - name: Migrate Prisma
        run: pnpm --filter api exec prisma migrate deploy

      - name: Generate prisma
        run: pnpm --filter api exec prisma generate --generator client --sql --config prisma.config.ts

      - name: Create buckets if necessary
        run: node apps/api/scripts/init-buckets.js

      - name: Generate OpenAPI clients
        shell: bash
        run: |
          setsid pnpm --filter api start:e2e &
          SERVER_PID=$!
          trap 'kill -- -$SERVER_PID 2>/dev/null || true' EXIT

          timeout 90 bash -c 'until curl -sf http://localhost:3000/openapi/root.json > /dev/null; do sleep 1; done'

          pnpm run openapi:generate
        env:
          PORT: '3000'

      - name: Open a pull request when clients drift
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_ACTOR: ${{ github.actor }}
          GIT_ACTOR_EMAIL: ${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com
        run: |
          if [ -z "$(git status --porcelain -- apps/client/src/generated apps/api-e2e/src/generated)" ]; then
            echo "Generated OpenAPI clients are already up to date."
            exit 0
          fi

          branch="chore/openapi"
          git config user.name "$GIT_ACTOR"
          git config user.email "$GIT_ACTOR_EMAIL"
          git checkout -B "$branch"
          git add apps/client/src/generated apps/api-e2e/src/generated
          git commit -m "chore(FON-000): sync generated OpenAPI clients"
          git push --force origin "$branch"

          if [ -n "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
            echo "An open pull request already tracks $branch; it now points at the fresh commit."
            exit 0
          fi

          gh pr create \
            --base develop \
            --head "$branch" \
            --title "chore(FON-000): sync generated OpenAPI clients" \
            --body "Generated OpenAPI clients drifted from the contract on \`develop\`. This PR regenerates them via \`pnpm run openapi:generate\`."
