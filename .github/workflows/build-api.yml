name: Build and upload API artifact

on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
    secrets:
      SENTRY_API_AUTH_TOKEN:
        required: false

jobs:
  build-api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:13.2
        env:
          POSTGRES_USER: fondation
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: fondation
        ports:
          - 5435:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: pnpm/action-setup@v4.2.0
        with:
          version: 10
          run_install: false

      - name: Use Node.js
        uses: actions/setup-node@v6.1.0
        with:
          node-version: '24.12.0'
          cache: 'pnpm'

      - name: Build Archive
        env:
          TZ: Etc/UTC
          DATABASE_URL: postgresql://fondation:secret@localhost:5435/fondation
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_API_AUTH_TOKEN }}
        run: ./apps/api/scripts/build-for-scalingo.sh

      - name: Upload as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: api-scalingo-${{ inputs.tag }}
          path: api-scalingo.tar.gz
          retention-days: 1
