name: Build and upload API artifact

on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
    secrets:
      SENTRY_API_AUTH_TOKEN:
        required: false

jobs:
  build-api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:13.2@sha256:0eee5caa50478ef50b89062903a5b901eb818dfd577d2be6800a4735af75e53f
        env:
          POSTGRES_USER: fondation
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: fondation
        ports:
          - 5435:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093
        with:
          version: 11.5.0
          run_install: false

      - name: Use Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '24.12.0'
          cache: 'pnpm'

      - name: Build Archive
        env:
          TZ: Etc/UTC
          DATABASE_URL: postgresql://fondation:secret@localhost:5435/fondation
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_API_AUTH_TOKEN }}
        run: ./apps/api/scripts/build-for-scalingo.sh

      - name: Upload as Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: api-scalingo-${{ inputs.tag }}
          path: api-scalingo.tar.gz
          retention-days: 1
