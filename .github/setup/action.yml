name: Set up the monorepo
description: Install the dependencies, build the internal packages and generate the Prisma client against the CI database

runs:
  using: 'composite'
  steps:
    - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093
      with:
        version: 11.28.8
        run_install: false

    - name: Use Node.js
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
      with:
        node-version: '24.22.1'
        cache: 'pnpm'

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile --ignore-scripts

    - name: Build internal dependencies
      shell: bash
      run: pnpm --filter "./packages/*" build

    - name: Migrate Prisma
      shell: bash
      run: pnpm --filter api exec prisma migrate deploy

    # the typed SQL queries are checked against the migrated database
    - name: Generate prisma
      shell: bash
      run: pnpm --filter api exec prisma generate --generator client --sql --config prisma.config.ts
