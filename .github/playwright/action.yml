# https://gist.github.com/dgrebb/34ba1d5683ee668e6c7282013a4065b9
name: Install Playwright
description: Install and cache Playwright

runs:
  using: 'composite'
  steps:
    - name: Get Playwright version
      id: playwright-version
      shell: bash
      run: |
        echo "version=$(grep '@playwright/test' apps/client/package.json | cksum | awk '{print $1}')" >> $GITHUB_OUTPUT

    - name: Cache Playwright
      uses: actions/cache@v5
      id: playwright_cache
      with:
        key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}
        path: |
          ~/.cache/ms-playwright

    - name: Install Playwright
      shell: bash
      if: steps.playwright_cache.outputs.cache-hit != 'true'
      run: |
        pnpm --filter client run \
          playwright install \
          --with-deps \
          --only-shell \
          chromium
