name: fondation

services:
  postgres:
    container_name: postgres-test
    image: 'postgres:17'
    ports:
      - '5435:5432'
    networks:
      - app_test
    user: postgres
    environment:
      POSTGRES_USER: fondation
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: fondation
    volumes:
      - postgres-17:/var/lib/postgresql/data

  gotenberg:
    container_name: gotenberg
    image: docker.io/gotenberg/gotenberg:8-chromium
    ports:
      - '9091:3000'
    networks:
      - app_test

  # Same image and settings as the services of the CI workflows
  s3:
    container_name: s3-test
    image: 'versity/versitygw:v1.10.0@sha256:89cad13cc981986ee284cbafea4613f9533ce6fd5f37a2c96c4c4fb8adb3a316'
    ports:
      - '9000:9000'
    networks:
      - app_test
    environment:
      ROOT_ACCESS_KEY: fondation
      ROOT_SECRET_KEY: fondation-secret
      VGW_BACKEND: posix
      VGW_BACKEND_ARG: /data
      VGW_PORT: ':9000'
      # Requests signed for another region are refused, and the default is us-east-1
      VGW_REGION: eu-west-2
      # Undoing a deletion when the transaction rolls back removes its delete marker, which needs a versioned bucket, as at Scaleway
      VGW_VERSIONING_DIR: /versions
    volumes:
      - s3-data:/data
      - s3-versions:/versions

networks:
  app_test:
    driver: bridge

volumes:
  # A data directory only opens with the major version that created it: renaming the volume on each upgrade starts an empty one
  postgres-17:
  s3-data:
  s3-versions:
