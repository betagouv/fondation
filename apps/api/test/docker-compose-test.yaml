name: fondation

services:
  postgres:
    container_name: postgres-test
    image: 'postgres:17'
    ports:
      - '5435:5432'
    networks:
      - app_test
    user: postgres
    environment:
      POSTGRES_USER: fondation
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: fondation
    volumes:
      - postgres-17:/var/lib/postgresql/data

  gotenberg:
    container_name: gotenberg
    image: docker.io/gotenberg/gotenberg:8-chromium
    ports:
      - '9091:3000'
    networks:
      - app_test

  minio:
    container_name: minio-test
    image: 'quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z'
    # Erasure Coding is required to enable versionning, so we create 4 drives
    entrypoint: sh -c "mkdir -p /data/{1..4} && minio server /data/{1...4} --console-address ':41079'"
    ports:
      - '9000:9000' # API
      - '41079:41079' # web-UI
    networks:
      - app_test
    environment:
      MINIO_ROOT_USER: fondation
      MINIO_ROOT_PASSWORD: fondation-secret
      MINIO_STORAGE_FREE_SPACE_THRESHOLD: 1GB

networks:
  app_test:
    driver: bridge

volumes:
  # A data directory only opens with the major version that created it: renaming the volume on each upgrade starts an empty one
  postgres-17:
