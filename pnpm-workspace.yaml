packages:
  - apps/*
  - packages/*

catalog:
  'zod': 4.4.3
  '@faker-js/faker': 10.5.0
  'oxlint': 1.76.0
  'oxlint-tsgolint': 0.25.0
  'typescript': 6.0.3
  '@types/node': 26.1.2
  '@hey-api/openapi-ts': 0.99.0
  'vitest': 4.1.10
  'vitest-mock-extended': 5.1.0

preferFrozenLockfile: true
minimumReleaseAge: 10080 # 7 days
overrides:
  node-xlsx>xlsx: '-'
  prosemirror-model: 1.25.11
  prosemirror-view: 1.42.2

# jest-dom augments `vitest` without depending on it, so pnpm resolves its
# augmentation against the api's vitest instead of the client's. Declaring the
# peer co-locates the right vitest per project. See https://github.com/betagouv/fondation/pull/437
packageExtensions:
  '@testing-library/jest-dom':
    peerDependencies:
      vitest: '*'
    peerDependenciesMeta:
      vitest:
        optional: true

allowBuilds:
  '@nestjs/core': true
  '@prisma/client': false
  '@swc/core': true
  '@prisma/engines': false
  '@scarf/scarf': false
  '@sentry/cli': false
  bcrypt: true
  prisma: false
  unrs-resolver: false
  esbuild: true
  msw: false
minimumReleaseAgeExclude:
  # Renovate security update: @hey-api/openapi-ts@0.97.3
  - '@hey-api/openapi-ts@0.97.3'
  # Renovate security update: axios@1.18.0
  - axios@1.18.0
  # Renovate security update: react-router@8.3.0
  - react-router@8.3.0
