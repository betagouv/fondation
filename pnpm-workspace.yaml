packages:
  - apps/*
  - packages/*

catalog:
  zod: 4.4.3
  '@faker-js/faker': 10.5.0
  oxlint: 1.72.0
  'oxlint-tsgolint': 0.24.0
  typescript: 6.0.3
  '@types/node': 26.0.1
  '@hey-api/openapi-ts': 0.99.0

preferFrozenLockfile: true
minimumReleaseAge: 10080 # 7 days
overrides:
  node-xlsx>xlsx: '-'

# jest-dom augments `vitest` without depending on it, so pnpm resolves its
# augmentation against the api's vitest instead of the client's. Declaring the
# peer co-locates the right vitest per project. See https://github.com/betagouv/fondation/pull/437
packageExtensions:
  '@testing-library/jest-dom':
    peerDependencies:
      vitest: '*'
    peerDependenciesMeta:
      vitest:
        optional: true

allowBuilds:
  '@nestjs/core': true
  '@prisma/client': false
  '@swc/core': true
  '@prisma/engines': false
  '@scarf/scarf': false
  '@sentry/cli': false
  bcrypt: true
  prisma: false
  puppeteer: false
  unrs-resolver: false
  esbuild: true
minimumReleaseAgeExclude:
  # Renovate security update: @hey-api/openapi-ts@0.97.3
  - '@hey-api/openapi-ts@0.97.3'
